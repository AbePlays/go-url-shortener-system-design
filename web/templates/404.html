<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
  <title>Lost in the void – tiny.link</title>
  <style>
    :root {
      --bg: #fff7ed;
      --surface: #ffffff;
      --text: #431407;
      --muted: #9a3412;
      --accent: #ea580c;
      --accent-soft: #ffedd5;
      --border: #fed7aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, #ffedd5 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, #fed7aa 0%, transparent 35%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 1.75rem;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border-bottom: 2px dashed var(--border);
    }

    nav .brand {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent);
      text-decoration: none;
    }

    nav .brand span {
      font-weight: 500;
      color: var(--muted);
    }

    nav .links {
      margin-left: auto;
      display: flex;
      gap: 1.25rem;
    }

    nav .links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
    }

    nav .links a:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    main {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 2.75rem 2rem;
      box-shadow: 6px 6px 0 var(--border);
    }

    .emoji {
      font-size: 3.5rem;
      margin-bottom: 0.75rem;
      line-height: 1;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
      margin-bottom: 1.75rem;
      font-size: 1.05rem;
    }

    a.button {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 4px 0 #c2410c;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    a.button:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 #c2410c;
    }

    a.button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c2410c;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">tiny<span>.link</span></a>
    <div class="links">
      <a href="/links">Links</a>
      <a href="/about">About</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <div class="emoji">🧭</div>
      <h1>404 – Page not found</h1>
      <p>This link wandered off into the void. It might be broken, deleted, or never existed.</p>
      <a href="/" class="button">Back to safety ✨</a>
    </div>
  </main>
</body>
</html>
