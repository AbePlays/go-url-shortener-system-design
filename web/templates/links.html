<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
  <title>All the tiny links</title>
  <style>
    :root {
      --bg: #fff7ed;
      --surface: #ffffff;
      --text: #431407;
      --muted: #9a3412;
      --accent: #ea580c;
      --accent-soft: #ffedd5;
      --border: #fed7aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 30%, #ffedd5 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, #fed7aa 0%, transparent 35%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 1.75rem;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border-bottom: 2px dashed var(--border);
    }

    nav .brand {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent);
      text-decoration: none;
    }

    nav .brand span {
      font-weight: 500;
      color: var(--muted);
    }

    nav .links {
      margin-left: auto;
      display: flex;
      gap: 1.25rem;
    }

    nav .links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
    }

    nav .links a:hover,
    nav .links a.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    main {
      max-width: 900px;
      margin: 2.75rem auto;
      padding: 0 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 6px 6px 0 var(--border);
      overflow-x: auto;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.925rem;
      min-width: 640px;
    }

    th {
      text-align: left;
      padding: 0.7rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 2px dashed var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.9rem 0.75rem;
      border-bottom: 1px solid #ffedd5;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td:first-child,
    th:first-child {
      width: 110px;
      white-space: nowrap;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }

    .code:hover {
      text-decoration: underline;
    }

    td:nth-child(2) {
      max-width: 420px;
      word-break: break-all;
    }

    td:nth-child(2) a {
      color: #0f766e;
      text-decoration: none;
    }

    td:nth-child(2) a:hover {
      text-decoration: underline;
    }

    td:nth-child(3),
    th:nth-child(3),
    td:nth-child(4),
    th:nth-child(4) {
      white-space: nowrap;
      width: 1%;
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .empty span {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">tiny<span>.link</span></a>
    <div class="links">
      <a href="/links" class="active">Links</a>
      <a href="/about">About</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <h1>All the tiny links</h1>
      <p class="subtitle">Everything you’ve shrunk so far.</p>

      {{ if .Links }}
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Original</th>
            <th>Clicks</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody>
          {{ range .Links }}
          <tr>
            <td><a class="code" href="/{{ .Code }}">{{ .Code }}</a></td>
            <td><a href="{{ .OriginalUrl }}" rel="noopener">{{ .OriginalUrl }}</a></td>
            <td>{{ .Clicks }}</td>
            <td>{{ .CreatedAt.Format "Jan 02, 2006" }}</td>
          </tr>
          {{ end }}
        </tbody>
      </table>
      {{ else }}
      <div class="empty">
        <span>📭</span>
        No links yet. Go make one!
      </div>
      {{ end }}
    </div>
  </main>
</body>
</html>
